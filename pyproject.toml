
[project]
name = "expense-tracker-mcp-server"
version = "0.1.0"
description = "Expense Tracker MCP Server"
readme = "README.md"
authors = [
    { name = "datasciencejourney", email = "datasciencejourney@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.21.0",
    "fastapi>=0.162.0",
    "fastmcp>=4.1.6",
    "langchain>=1.4.9",
    "langchain-mcp-adapters>=0.3.1",
    "langchain-openai>=1.7.4",
    "pandas>=3.1.1",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "streamlit>=1.67.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
expense-tracker-mcp-server = "expense_tracker_mcp_server:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false
